org.gradle.jvmargs=-Xmx4G
# Reuse task outputs and build independent plugin projects concurrently.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# Keep Flutter plugins on the legacy KGP and AGP DSL until each plugin has
# migrated to AGP 9's built-in Kotlin and new DSL APIs.
android.builtInKotlin=false
android.newDsl=false
